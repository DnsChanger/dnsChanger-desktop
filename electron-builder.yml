appId: dnschanger.github.io
productName: DNSChanger
afterPack: 'removeLocales.js'
artifactName: '${productName}-${os}-${arch}-${version}.${ext}'
files:
  - '**/*'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme,test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/.bin'
  - '!**/*.{o,hprof,orig,pyc,pyo,rbc}'
  - '!**/._*'
  - '!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,__pycache__,thumbs.db,.gitignore,.gitattributes,.editorconfig,.flowconfig,.yarn-metadata.json,.idea,appveyor.yml,.travis.yml,circle.yml,npm-debug.log,.nyc_output,yarn.lock,.yarn-integrity}'
  - '!**/node_modules/search-index/si${/*}'
  - '!**/*.md' # ignore md files
  - '!**/*.yml' # ignore yml files
  - '!**/.github'
  - '!**/release'
  - '!**/.eslint*'
  - '!**/jest*'
  - '!**/*.test.*'
  - '!**/*.spec.*'
  - '!**/__tests__'
  - '!**/__test__'
asar: true
compression: maximum
directories:
  output: 'release/${version}'
win:
  icon: 'public/icons/icon.ico'
  requestedExecutionLevel: 'highestAvailable'
  publish:
    - github
  target:
    - zip
    - msi
    - nsis
linux:
  icon: 'public/icons/icon.png'
  maintainer: 'dnschanger.github.io'
  vendor: 'DnsChanger'
  synopsis: 'DNS Changer for Linux'
  description: 'Change system DNS settings easily on Linux (NetworkManager / systemd-resolved)'
  executableName: dnschanger
  desktop:
    entry:
      Name: DNS Changer
      Comment: Change system DNS settings easily
      Categories: Utility;Network;
      StartupWMClass: dnschanger
      Terminal: false
      Type: Application
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
  publish:
    - github
deb:
  packageName: dnschanger
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - libappindicator3-1
    - network-manager
  afterInstall: 'build/postinst.sh'
rpm:
  packageName: dnschanger
mac:
  icon: 'public/icons/icon.png'
  target:
    - dmg
    - zip
  category: Utilities
  publish:
    - github
nsis:
  perMachine: true
  oneClick: false
  installerIcon: 'public/icons/icon.ico'
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  createDesktopShortcut: true
  allowToChangeInstallationDirectory: true
  shortcutName: 'DNS Changer'
npmRebuild: true
nodeGypRebuild: false

publish:
  provider: github
  owner: 'DnsChanger'
  repo: 'dnsChanger-desktop'
